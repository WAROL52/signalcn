name: CI

on:
  pull_request:
  # Au tag, la suite rapide ne change a rien d'autre — c'est #32 qui fixe les seuils.
  push:
    branches: [master]
    tags: ["v*"]

# Trois jobs — rapide, distribution, canari — et non un par contrôle. Le coût dominant n'est pas
# la commande : c'est le démarrage de runner. Les contrôles rapides coûtent près de vingt secondes
# ensemble, et les séparer en paierait onze démarrages pour lire onze messages différents.
# Voir docs/ci.md §1.
#
# Le job « distribution » est séparé parce qu'il coûte 5,4 fois plus que tous les autres
# réunis, et qu'il a un propriétaire différent : il vérifie l'installation, pas le moteur.
jobs:
  rapide:
    name: rapide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # L'historique COMPLET, pour un seul motif : la non-régression de couverture se mesure
          # contre le MERGE-BASE, recalculé dans un worktree secondaire. Sans `fetch-depth: 0` le
          # merge-base n'existe pas et la porte se rabat sur « non applicable » — c'est-à-dire
          # qu'elle disparaît silencieusement, ce qui est le pire mode de défaillance pour une
          # garde censée être la seule chose qui empêche une baisse.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # L'ordre est par SÉVÉRITÉ, pas par coût. Un job qui exécute tout de toute façon ne paie
      # rien de plus pour être dans le bon ordre, et c'est le premier message lu qui décide de
      # ce qu'on regarde ensuite. Les contrôles 7, 8 et 9 dépendent du 5 : le test minifié vise
      # le runtime minifié, et le diff se fait sur ce que le build vient d'écrire. Le contrôle 6
      # en dépend aussi : il mesure l'artefact minifié, pas la source. L'ordre est donc aussi un
      # ordre de dépendance.
      - name: conformite — harnais differentiel contre la baseline
        run: npm run harnais
      # Position 2 comme dans docs/ci.md §2 : apres la conformite, qui est le seul echec qui dit
      # que le produit est faux, et avant tout ce qui depend du build.
      - name: couverture — seuils natifs, code mort, non-regression face au merge-base
        run: npm run couverture
      - name: typecheck
        run: npm run typecheck
      - name: suite source
        run: npm run test
      # Position 5 comme dans docs/ci.md §2 : la FORME d'un code qui compile et qui passe n'est pas
      # plus grave que le code lui-même — donc apres les deux, et avant tout ce qui depend du build.
      - name: biome — forme et corrections du ruleset recommended
        run: npm run biome
      - name: build
        run: npm run build
      # Position 7 comme dans docs/ci.md §2 : juste apres le build, parce que la porte mesure
      # l'artefact minifie — donc elle n'a rien a dire avant qu'il existe — et juste avant les
      # portes du build, parce qu'une dependance glissee dans le coeur est plus grave qu'un build
      # non reproductible.
      - name: zero-dependance — le coeur distribue ne lit que lui-meme
        run: npm run zero-dependance
      - name: portes du build
        run: npm run verifier-build
      # Apres le build, comme dans docs/ci.md §2 : la parite juge les ARTEFACTS, donc elle n'a
      # rien a dire avant qu'ils existent.
      - name: parite — la meme table sur les quatre cibles
        run: npm run parite
      - name: derive — le build ne touche aucun artefact commite
        run: npm run verifier-derive
      # Le README est le seul document qui parle a un consommateur, et le seul qui peut mentir
      # sans que la suite le remarque : rien ne dit que le bloc d'import nomme la vraie surface.
      - name: documentation — le README declare la surface reelle
        run: npm run documentation

  distribution:
    name: distribution / installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # L'historique COMPLET, pour un seul motif : la non-régression de couverture se mesure
          # contre le MERGE-BASE, recalculé dans un worktree secondaire. Sans `fetch-depth: 0` le
          # merge-base n'existe pas et la porte se rabat sur « non applicable » — c'est-à-dire
          # qu'elle disparaît silencieusement, ce qui est le pire mode de défaillance pour une
          # garde censée être la seule chose qui empêche une baisse.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verifier-installation

  # Le canari ne BLOQUE pas. Il répond à une seule question : la version publiée de la CLI fait-elle
  # encore ce que la nôtre fait ? Elle le fera ne plus à un moment, et le jour où elle casse, une
  # alerte non bloquante donne le temps de reagIR au lieu de subir.
  canari:
    name: canari / derniere CLI publiee
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: installation avec la derniere CLI publiee
        run: npm run verifier-installation
        env:
          SIGNALCN_CLI: '[{"nom":"shadcn latest","paquet":"shadcn@latest"}]' 
