name: CI

on:
  pull_request:
  # Au tag, la suite rapide ne change a rien d'autre — c'est #32 qui fixe les seuils.
  push:
    branches: [master]
    tags: ["v*"]

# Quatre jobs — rapide, distribution, canari, documentation-statique — et non un par contrôle. Le
# coût dominant n'est pas la commande : c'est le démarrage de runner. Les contrôles hors
# installation coûtent 25,9 secondes ensemble, et les séparer en paierait quinze démarrages pour
# lire quinze messages différents. Voir site/contributeurs/ci.md §1.
#
# Le job « distribution » est séparé parce qu'il coûte 4,1 fois plus que tous les autres
# réunis, et qu'il a un propriétaire différent : il vérifie l'installation, pas le moteur.
#
# Le job « documentation-statique » est séparé pour la même raison de coût — il installe le
# générateur de site — et parce qu'il construit le SITE. C'est un contrôle comme un autre : il
# échoue, et la pull request est rouge. Le déploiement sur GitHub Pages n'y est PAS, et ne peut
# pas y être : voir site/contributeurs/ci.md §4.
jobs:
  rapide:
    name: rapide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # L'historique COMPLET, pour un seul motif : la non-régression de couverture se mesure
          # contre le MERGE-BASE, recalculé dans un worktree secondaire. Sans `fetch-depth: 0` le
          # merge-base n'existe pas et la porte se rabat sur « non applicable » — c'est-à-dire
          # qu'elle disparaît silencieusement, ce qui est le pire mode de défaillance pour une
          # garde censée être la seule chose qui empêche une baisse.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # L'ordre est par SÉVÉRITÉ, pas par coût. Un job qui exécute tout de toute façon ne paie
      # rien de plus pour être dans le bon ordre, et c'est le premier message lu qui décide de
      # ce qu'on regarde ensuite. Les contrôles 7, 8 et 9 dépendent du 5 : le test minifié vise
      # le runtime minifié, et le diff se fait sur ce que le build vient d'écrire. Le contrôle 6
      # en dépend aussi : il mesure l'artefact minifié, pas la source. L'ordre est donc aussi un
      # ordre de dépendance.
      - name: conformite — harnais differentiel contre la baseline
        run: npm run harnais
      # Position 2 comme dans site/contributeurs/ci.md §2 : apres la conformite, qui est le seul echec qui dit
      # que le produit est faux, et avant tout ce qui depend du build.
      - name: couverture — seuils natifs, code mort, non-regression face au merge-base
        run: npm run couverture
      - name: typecheck
        run: npm run typecheck
      - name: suite source
        run: npm run test
      # Position 5 comme dans site/contributeurs/ci.md §2 : la FORME d'un code qui compile et qui passe n'est pas
      # plus grave que le code lui-même — donc apres les deux, et avant tout ce qui depend du build.
      - name: biome — forme et corrections du ruleset recommended
        run: npm run biome
      - name: build
        run: npm run build
      # Position 7 comme dans site/contributeurs/ci.md §2 : juste apres le build, parce que la porte mesure
      # l'artefact minifie — donc elle n'a rien a dire avant qu'il existe — et juste avant les
      # portes du build, parce qu'une dependance glissee dans le coeur est plus grave qu'un build
      # non reproductible.
      - name: zero-dependance — le coeur distribue ne lit que lui-meme
        run: npm run zero-dependance
      - name: portes du build
        run: npm run verifier-build
      # Apres le build, comme dans site/contributeurs/ci.md §2 : la parite juge les ARTEFACTS, donc elle n'a
      # rien a dire avant qu'ils existent.
      - name: parite — la meme table sur les quatre cibles
        run: npm run parite
      - name: derive — le build ne touche aucun artefact commite
        run: npm run verifier-derive
      # Le README est le seul document qui parle a un consommateur, et le seul qui peut mentir
      # sans que la suite le remarque : rien ne dit que le bloc d'import nomme la vraie surface.
      - name: documentation — le README declare la surface reelle
        run: npm run documentation
      # Le dernier, et le seul qui ne juge pas le changement proposé : il compare le ruleset
      # versionné aux jobs que ce fichier déclare. Sans lui, un cinquième job ajouté ici sans
      # être requis au ruleset laisserait la PR suivante se fusionner sans son contrôle. Il ne
      # dépend d'aucun build — il lit deux fichiers du dépôt — donc le placer ici est gratuit.
      - name: ruleset — les checks requis sont ceux de la CI
        run: npm run verifier-ruleset

  distribution:
    name: distribution / installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # L'historique COMPLET, pour un seul motif : la non-régression de couverture se mesure
          # contre le MERGE-BASE, recalculé dans un worktree secondaire. Sans `fetch-depth: 0` le
          # merge-base n'existe pas et la porte se rabat sur « non applicable » — c'est-à-dire
          # qu'elle disparaît silencieusement, ce qui est le pire mode de défaillance pour une
          # garde censée être la seule chose qui empêche une baisse.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verifier-installation

# Le canari BLOQUE. Il portait `continue-on-error` parce qu'il ne pouvait pas faire autrement : un
  # job ainsi marqué ne peut pas être un check requis, et le ruleset exige les quatre jobs. Il répond
  # à une seule question : la version publiée de la CLI fait-elle encore ce que la nôtre fait ? Elle
  # ne le fera plus à un moment, et le prix de le savoir est qu'une version publiée qui casse bloque
  # les fusions au lieu de les alerter. `verifier-ruleset` interdit de remettre `continue-on-error`
  # ici : le ruleset afficherait alors un contrôle qui ne bloque rien.
  canari:
    name: canari / derniere CLI publiee
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: installation avec la derniere CLI publiee
        run: npm run verifier-installation
        env:
          SIGNALCN_CLI: '[{"nom":"shadcn latest","paquet":"shadcn@latest"}]'

  # Le quatrième job, et le seul qui construise le SITE. Il est un contrôle comme un autre : son
  # échec met la pull request en rouge, et c'est ce qui le rend listable comme check requis — le
  # ruleset ne peut pas déclarer un job qui n'existe pas, c'est #52 qui est bloqué par celui-ci.
  #
  # Le déploiement sur GitHub Pages n'est PAS ici, et ne peut pas y être : un job qui déploie ne
  # peut pas être un check requis, et surtout un déploiement réussi ne doit pas pouvoir masquer un
  # build cassé. Il est dans deploy.yml, déclenché par le TAG — la politique de versionnement du
  # site (#51) dit « version courante seule », donc le site est la version livrée. Voir
  # site/contributeurs/ci.md §4 et §5.
  documentation-statique:
    name: documentation-statique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: build du site — VitePress, ici comme en local
        run: npm run documentation-statique
      # La porte suit le build et ne le relance pas : elle relit l'instantané que le build a pris
      # AVANT de tourner, et n'accuse que ce qui est devenu sale entre les deux — donc un arbre de
      # travail sale n'est pas un échec, et le périmètre est tout le dépôt hors `site/`.
      # `verifier-derive` ne le verrait pas : son `git diff` ne voit ni un fichier NEUF, ni un chemin
      # hors de registry/default/. Voir site/contributeurs/ci.md §4.
      - name: proprete — le build du site n'ecrit rien hors de site/
        run: npm run verifier-proprete
      # Apres la propreté, parce qu'elle n'a rien à dire du contenu des pages : elle lit `git status`.
      # Cette porte lit la SORTIE du build — pas les sources — et vérifie que chaque lien interne y
      # pointe vers un fichier qui existe. Elle prend le relais du build sur la forme `site/x`, la
      # seule qui marche dans le dépôt ET dans le site, et que VitePress ne valide pas (#65).
      - name: liens publies — chaque lien interne existe dans la sortie du build
        run: npm run verifier-liens-publies
